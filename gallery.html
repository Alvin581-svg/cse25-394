<!-- gallery.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Gallery - Webbs Motors</title>

    <!-- CSS -->
    <link rel="stylesheet" href="gallery.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- TOP LINE -->
    <div class="top-line"></div>

    <!-- HEADER -->
    <header>

        <!-- LOGO -->
        <div class="logo">
            <img src="images/logo.png" alt="Webbs Motors Logo">
        </div>

        <!-- NAVIGATION -->
        <nav>

            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="gallery.html" class="active">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="feedback.html">Feedback</a>

        </nav>

    </header>

    <!-- TITLE -->
    <section class="gallery-title">

        <h1>
            OUR <span>GALLERY</span>
        </h1>

        <div class="underline"></div>

        <p>
            See some of our recent work.
        </p>

    </section>

    <!-- FILTER BUTTONS -->
    <section class="filter-buttons">

        <button class="active-btn">ALL</button>
        <button>PANEL BEATING</button>
        <button>SPRAY PAINTING</button>
        <button>BEFORE & AFTER</button>
        <button>OTHER</button>

    </section>

    <!-- GALLERY GRID -->
    <section class="gallery-container">

        <div class="gallery-item">
            <img src="images/gallery1.jpg" alt="">
        </div>

        <div class="gallery-item">
            <img src="images/gallery2.jpg" alt="">
        </div>

        <div class="gallery-item">
            <img src="images/gallery3.jpg" alt="">
        </div>

        <div class="gallery-item">
            <img src="images/gallery4.jpg" alt="">
        </div>

        <div class="gallery-item">
            <img src="images/gallery5.jpg" alt="">
        </div>

        <div class="gallery-item">
            <img src="images/gallery6.jpg" alt="">
        </div>

        <div class="gallery-item">
            <img src="images/gallery7.jpg" alt="">
        </div>

        <div class="gallery-item">
            <img src="images/gallery8.jpg" alt="">
        </div>

    </section>

    <!-- CTA SECTION -->
    <section class="cta-section">

        <div class="cta-content">

            <div class="cta-text">
                <h2>Ready to restore your vehicle?</h2>
                <p>Contact us today for a free assessment.</p>
            </div>

            <a href="contact.html" class="cta-btn">
                GET IN TOUCH
            </a>

        </div>

    </section>

    <!-- FOOTER -->
    <footer>

        <div class="footer-content">

            <!-- FOOTER LOGO -->
            <div class="footer-logo">
                <img src="images/logo.png" alt="">
            </div>

            <!-- SOCIAL ICONS -->
            <div class="footer-socials">

                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>

                <a href="#"><i class="fa-brands fa-instagram"></i></a>

                <a href="#"><i class="fa-brands fa-whatsapp"></i></a>

            </div>

            <!-- FOOTER LINKS -->
            <div class="footer-links">

                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="services.html">Services</a>
                <a href="gallery.html">Gallery</a>
                <a href="contact.html">Contact</a>
                <a href="feedback.html">Feedback</a>

            </div>

        </div>

        <p class="copyright">
            © 2025 Webbs Motors. All Rights Reserved.
        </p>

    </footer>

</body>
</html>
