<!-- gallery.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Webbs Motors</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/gallery.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">

        <!-- TOP LINES -->
        <div class="top-line">

            <div class="red-line"></div>

            <div class="green-line"></div>

        </div>

        <!-- NAVBAR -->
        <nav class="navbar">

            <!-- LOGO -->
            <div class="logo">

                <img src="images/logo.png"
                alt="Webbs Motors Logo">

            </div>

            <!-- NAVIGATION LINKS -->
            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About Us</a>
                </li>

                <li>
                    <a href="services.html">Services</a>
                </li>

                <li>
                    <a href="gallery.html"
                    class="active">
                        Gallery
                    </a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

                <li>
                    <a href="feedback.html">Feedback</a>
                </li>

            </ul>

        </nav>

    </header>

    <!-- GALLERY TITLE -->
    <section class="gallery-title">

        <h1>
            OUR

            <span class="red-text">
                GALLERY
            </span>
        </h1>

        <!-- SMALL LINE -->
        <div class="title-line">

            <div class="small-red"></div>

            <div class="small-green"></div>

        </div>

        <p>
            See some of our recent work.
        </p>

    </section>

    <!-- FILTER BUTTONS -->
    <section class="gallery-filters">

        <button class="filter-btn active-btn">
            ALL
        </button>

        <button class="filter-btn">
            PANEL BEATING
        </button>

        <button class="filter-btn">
            SPRAY PAINTING
        </button>

        <button class="filter-btn">
            BEFORE & AFTER
        </button>

        <button class="filter-btn">
            OTHER
        </button>

    </section>

    <!-- GALLERY GRID -->
    <section class="gallery-section">

        <!-- IMAGE 1 -->
        <div class="gallery-item">

            <img src="images/gallery1.jpg"
            alt="Damaged Vehicle">

        </div>

        <!-- IMAGE 2 -->
        <div class="gallery-item">

            <img src="images/gallery2.jpg"
            alt="White Range Rover">

        </div>

        <!-- IMAGE 3 -->
        <div class="gallery-item">

            <img src="images/gallery3.jpg"
            alt="Vehicle Repair">

        </div>

        <!-- IMAGE 4 -->
        <div class="gallery-item">

            <img src="images/gallery4.jpg"
            alt="Toyota Hilux">

        </div>

        <!-- IMAGE 5 -->
        <div class="gallery-item">

            <img src="images/gallery5.jpg"
            alt="Red Mazda">

        </div>

        <!-- IMAGE 6 -->
        <div class="gallery-item">

            <img src="images/gallery6.jpg"
            alt="Red Vehicle Repair">

        </div>

        <!-- IMAGE 7 -->
        <div class="gallery-item">

            <img src="images/gallery7.jpg"
            alt="Silver Mercedes">

        </div>

        <!-- IMAGE 8 -->
        <div class="gallery-item">

            <img src="images/gallery8.jpg"
            alt="Silver Volkswagen">

        </div>

    </section>

    <!-- CALL TO ACTION -->
    <section class="cta-section">

        <!-- DARK OVERLAY -->
        <div class="cta-overlay"></div>

        <!-- CTA CONTENT -->
        <div class="cta-content">

            <!-- LEFT TEXT -->
            <div class="cta-text">

                <h2>
                    Ready to restore your vehicle?
                </h2>

                <p>
                    Contact us today for a free assessment.
                </p>

            </div>

            <!-- BUTTON -->
            <div class="cta-button">

                <a href="contact.html">
                    GET IN TOUCH
                </a>

            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">

        <!-- LEFT SIDE -->
        <div class="footer-left">

            <!-- LOGO -->
            <div class="footer-logo">

                <img src="images/logo.png"
                alt="Webbs Motors Logo">

            </div>

            <!-- SOCIAL ICONS -->
            <div class="social-icons">

                <a href="#">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

                <a href="#">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>

            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="footer-right">

            <!-- FOOTER LINKS -->
            <div class="footer-links">

                <a href="index.html">Home</a>

                <a href="about.html">About Us</a>

                <a href="services.html">Services</a>

                <a href="gallery.html">Gallery</a>

                <a href="contact.html">Contact</a>

                <a href="feedback.html">Feedback</a>

            </div>

            <!-- COPYRIGHT -->
            <div class="copyright">

                <p>
                    © 2025 Webbs Motors.
                    All Rights Reserved.
                </p>

            </div>

        </div>

    </footer>

</body>
</html>
